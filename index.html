<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admissões · Cabana Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1E8E3E; --verde-escuro:#14632B; --verde-claro:#E8F5EC;
  --laranja:#F07F1A; --laranja-escuro:#A84F00; --laranja-claro:#FFF1E4;
  --preto:#000; --cinza:#5E6661; --linha:#E1E6E2; --branco:#fff;
  --fonte:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--branco);color:var(--preto);font-family:var(--fonte);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em}
h1 b{color:var(--verde);font-weight:700}
.sub{color:var(--cinza);font-size:14px;margin-top:6px}
.janela{border:2px solid var(--verde);border-radius:18px;padding:12px 18px;min-width:230px}
.janela small{display:block;color:var(--cinza);font-size:13px}
.janela strong{font-size:22px;color:var(--verde-escuro);font-weight:700}

.aviso{display:none;background:var(--laranja-claro);color:var(--laranja-escuro);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:20px}

.esteira{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;position:relative}
.esteira::before{content:"";position:absolute;left:7%;right:7%;top:27px;height:3px;background:var(--verde-claro);z-index:0}
.etapa{position:relative;z-index:1;background:none;border:0;cursor:pointer;padding:0 4px 8px;text-align:center}
.etapa .n{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:var(--branco);border:3px solid var(--verde-claro);font-size:22px;font-weight:700;transition:border-color .15s,background .15s}
.etapa .n.tem{border-color:var(--verde)}
.etapa .n.atraso{border-color:var(--laranja)}
.etapa span{display:block;font-size:13px;color:var(--cinza);line-height:1.25}
.etapa .meta{font-size:12px;color:var(--verde)}
.etapa[aria-pressed="true"] .n{background:var(--verde);color:var(--branco);border-color:var(--verde)}
.etapa[aria-pressed="true"] span{color:var(--preto)}
.regua{display:flex;justify-content:space-between;font-size:13px;color:var(--cinza);border-top:1px dashed var(--linha);padding-top:10px;margin-bottom:28px}
.regua b{color:var(--verde-escuro);font-weight:500}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.kpi{border-top:3px solid var(--verde);padding:10px 2px 0}
.kpi.alerta{border-top-color:var(--laranja)}
.kpi strong{display:block;font-size:30px;font-weight:700;line-height:1.1}
.kpi.alerta strong{color:var(--laranja-escuro)}
.kpi small{color:var(--cinza);font-size:13px}

.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros input,.filtros select{border:1px solid var(--linha);border-radius:999px;padding:8px 14px;background:var(--branco)}
.filtros input{flex:1;min-width:180px}
.filtros label{font-size:14px;color:var(--cinza);display:flex;gap:6px;align-items:center;cursor:pointer}
.filtros input[type=checkbox]{accent-color:var(--verde);min-width:0;flex:none}
.limpar{border:0;background:none;color:var(--verde-escuro);text-decoration:underline;cursor:pointer;padding:4px}

.lista{border-top:1px solid var(--linha)}
.linha{display:grid;grid-template-columns:minmax(210px,1.3fr) minmax(250px,1.6fr) minmax(170px,1fr);gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--linha)}
.linha.encerrada{opacity:.55}
.vaga strong{font-size:16px;font-weight:500}
.vaga small{display:block;color:var(--cinza);font-size:13px}
.cod{display:inline-block;font-size:12px;font-weight:500;color:var(--verde-escuro);background:var(--verde-claro);border-radius:999px;padding:1px 9px;margin-right:6px}
.trilha{display:flex;align-items:center;gap:0}
.trilha i{flex:1;height:2px;background:var(--linha)}
.trilha i.ok{background:var(--verde)}
.ponto{width:14px;height:14px;border-radius:50%;border:2px solid var(--linha);background:var(--branco);flex:none}
.ponto.ok{background:var(--verde);border-color:var(--verde)}
.ponto.atual{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-claro)}
.ponto.atual.atraso{border-color:var(--laranja);box-shadow:0 0 0 3px var(--laranja-claro)}
.trilha-txt{font-size:13px;color:var(--cinza);margin-top:6px}
.trilha-txt b{color:var(--preto);font-weight:500}
.info{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tag{font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag.d{background:var(--verde-claro);color:var(--verde-escuro);font-weight:500}
.tag.a{background:var(--laranja-claro);color:var(--laranja-escuro)}
.tag.n{border:1px solid var(--linha);color:var(--cinza)}
.vazio{padding:40px 0;text-align:center;color:var(--cinza)}

footer{margin-top:36px;font-size:13px;color:var(--cinza);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:820px){
  .esteira{grid-template-columns:repeat(4,1fr);row-gap:14px}
  .esteira::before{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .linha{grid-template-columns:1fr;gap:10px}
  .info{justify-content:flex-start}
  h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Admissões <b>Cabana</b></h1>
      <div class="sub" id="atualizado">Carregando…</div>
    </div>
    <div class="janela" title="Admissões às segundas e quintas, exceto nos 5 últimos dias do mês">
      <small>Próxima data de admissão</small>
      <strong id="proxima">—</strong>
    </div>
  </header>

  <div class="aviso" id="aviso">Não foi possível ler o vagas.json. Exibindo dados de exemplo.</div>

  <nav class="esteira" id="esteira" aria-label="Etapas do processo"></nav>
  <div class="regua"><span>Abertura → divulgação: <b>mesmo dia</b></span><span>Aprovação na loja → início: <b>até 7 dias</b></span></div>

  <section class="kpis" id="kpis"></section>

  <div class="filtros">
    <input type="search" id="busca" placeholder="Buscar por código, cargo ou candidato" aria-label="Buscar">
    <select id="loja" aria-label="Filtrar por loja"><option value="">Todas as lojas</option></select>
    <label><input type="checkbox" id="soAtraso"> Só atrasados</label>
    <label><input type="checkbox" id="encerrados"> Mostrar encerrados</label>
    <button class="limpar" id="limpar">Limpar filtros</button>
  </div>

  <section class="lista" id="lista" aria-live="polite"></section>

  <footer>
    <span>Este painel não exibe dados pessoais. Candidatos aparecem só pelas iniciais.</span>
    <span>Dúvidas: RH · Gente &amp; Gestão</span>
  </footer>
</div>

<script>
const ETAPAS = [
  {id:"selecao",   nome:"Em seleção",          meta:""},
  {id:"docs",      nome:"Documentos",          meta:"até D1", limite:1},
  {id:"oris",      nome:"Lançamento no Oris",  meta:"até D2", limite:2},
  {id:"aso",       nome:"ASO",                 meta:"até D3", limite:3},
  {id:"programar", nome:"Programar admissão",  meta:"até D4", limite:4},
  {id:"agendado",  nome:"Início agendado",     meta:"até D7", limite:7},
  {id:"admitido",  nome:"Admitido",            meta:""}
];
const EXEMPLO = {atualizado_em:"2026-10-08T09:30", vagas:[
  {codigo:"V-2051",loja:"Loja 07",cargo:"Chapeiro",turno:"Noite",abertura:"2026-10-07",salario_aprovado:false,vaga_oris:false,candidato:"",d0:null,docs:null,oris:null,aso:null,admissao:null,inicio:null,situacao:"Ativa"},
  {codigo:"V-2049",loja:"Loja 03",cargo:"Atendente",turno:"Tarde",abertura:"2026-10-02",salario_aprovado:true,vaga_oris:true,candidato:"M.A.",d0:"2026-10-06",docs:null,oris:null,aso:null,admissao:null,inicio:null,situacao:"Ativa"},
  {codigo:"V-2048",loja:"Loja 03",cargo:"Atendente",turno:"Noite",abertura:"2026-10-01",salario_aprovado:true,vaga_oris:true,candidato:"J.S.",d0:"2026-10-05",docs:"2026-10-06",oris:"2026-10-06",aso:"2026-10-08",admissao:"2026-10-12",inicio:null,situacao:"Ativa"},
  {codigo:"V-2046",loja:"Loja 11",cargo:"Auxiliar de cozinha",turno:"Manhã",abertura:"2026-09-29",salario_aprovado:true,vaga_oris:true,candidato:"R.C.",d0:"2026-10-07",docs:"2026-10-07",oris:"2026-10-08",aso:null,admissao:null,inicio:null,situacao:"Ativa"},
  {codigo:"V-2044",loja:"Loja 01",cargo:"Caixa",turno:"Tarde",abertura:"2026-09-25",salario_aprovado:true,vaga_oris:true,candidato:"L.P.",d0:"2026-10-02",docs:"2026-10-03",oris:"2026-10-05",aso:"2026-10-06",admissao:null,inicio:null,situacao:"Ativa"},
  {codigo:"V-2050",loja:"Loja 12",cargo:"Líder de turno",turno:"Noite",abertura:"2026-10-05",salario_aprovado:true,vaga_oris:true,candidato:"",d0:null,docs:null,oris:null,aso:null,admissao:null,inicio:null,situacao:"Ativa"},
  {codigo:"V-2040",loja:"Loja 07",cargo:"Atendente",turno:"Manhã",abertura:"2026-09-18",salario_aprovado:true,vaga_oris:true,candidato:"A.F.",d0:"2026-09-24",docs:"2026-09-25",oris:"2026-09-25",aso:"2026-09-28",admissao:"2026-10-01",inicio:"2026-10-01",situacao:"Ativa"},
  {codigo:"V-2038",loja:"Loja 05",cargo:"Chapeiro",turno:"Tarde",abertura:"2026-09-15",salario_aprovado:true,vaga_oris:true,candidato:"T.B.",d0:"2026-09-21",docs:"2026-09-22",oris:"2026-09-23",aso:"2026-09-25",admissao:"2026-09-28",inicio:"2026-09-28",situacao:"Ativa"},
  {codigo:"V-2042",loja:"Loja 09",cargo:"Atendente",turno:"Noite",abertura:"2026-09-22",salario_aprovado:true,vaga_oris:true,candidato:"G.N.",d0:"2026-09-29",docs:null,oris:null,aso:null,admissao:null,inicio:null,situacao:"Desistência"}
]};

const HOJE = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const dt = s => { if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const dias = (a,b) => Math.round((b-a)/86400000);
const fmt = d => d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}).replace(".","");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dataPermitida(d){
  const ultimo = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const dia = d.getDay();
  return (dia===1 || dia===4) && d.getDate() <= ultimo-5;
}
function proximaJanela(apartir){
  const d = new Date(apartir); d.setDate(d.getDate()+1);
  for(let i=0;i<60;i++){ if(dataPermitida(d)) return new Date(d); d.setDate(d.getDate()+1); }
  return null;
}

function analisar(v){
  const encerrada = v.situacao && v.situacao !== "Ativa";
  let idx;
  if(v.inicio) idx=6;
  else if(!v.d0) idx=0;
  else if(!v.docs) idx=1;
  else if(!v.oris) idx=2;
  else if(!v.aso) idx=3;
  else if(!v.admissao) idx=4;
  else idx=5;

  const d0 = dt(v.d0);
  const decorridos = d0 ? dias(d0, dt(v.inicio) || HOJE) : null;
  const alertas = [];
  if(!encerrada){
    if(!v.salario_aprovado) alertas.push("Salário sem aprovação");
    if(v.d0 && !v.vaga_oris) alertas.push("Vaga não criada no Oris");
    const lim = ETAPAS[idx].limite;
    if(lim && decorridos > lim && idx<5) alertas.push(`Etapa atrasada (D+${decorridos})`);
    if(idx===5){
      const adm = dt(v.admissao);
      if(dias(d0,adm) > 7) alertas.push(`Início em D+${dias(d0,adm)}`);
      if(!dataPermitida(adm)) alertas.push("Data fora da regra seg/qui");
    }
    if(idx===0 && v.abertura && dias(dt(v.abertura),HOJE) > 10) alertas.push(`Aberta há ${dias(dt(v.abertura),HOJE)} dias`);
  }
  return {...v, idx, encerrada, decorridos, alertas, atraso: alertas.length>0};
}

let DADOS=[], filtroEtapa=null;

function render(){
  const busca = document.getElementById("busca").value.trim().toLowerCase();
  const loja = document.getElementById("loja").value;
  const soAtraso = document.getElementById("soAtraso").checked;
  const mostrarEnc = document.getElementById("encerrados").checked;

  const ativos = DADOS.filter(v=>!v.encerrada);
  document.getElementById("esteira").innerHTML = ETAPAS.map((e,i)=>{
    const q = ativos.filter(v=>v.idx===i && (!loja||v.loja===loja));
    const at = q.some(v=>v.atraso);
    return `<button class="etapa" aria-pressed="${filtroEtapa===i}" data-i="${i}">
      <div class="n ${q.length?"tem":""} ${at?"atraso":""}">${q.length}</div>
      <span>${e.nome}</span>${e.meta?`<span class="meta">${e.meta}</span>`:""}</button>`;
  }).join("");
  document.querySelectorAll(".etapa").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; filtroEtapa = filtroEtapa===i?null:i; render();
  });

  const base = ativos.filter(v=>!loja||v.loja===loja);
  const emAdm = base.filter(v=>v.idx>=1 && v.idx<=5).length;
  const atrasados = base.filter(v=>v.atraso).length;
  const limite90 = new Date(HOJE); limite90.setDate(limite90.getDate()-90);
  const concl = base.filter(v=>v.inicio && dt(v.inicio)>=limite90);
  const media = concl.length ? (concl.reduce((s,v)=>s+v.decorridos,0)/concl.length) : null;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><strong>${base.filter(v=>v.idx===0).length}</strong><small>Vagas em seleção</small></div>
    <div class="kpi"><strong>${emAdm}</strong><small>Candidatos em admissão</small></div>
    <div class="kpi ${atrasados?"alerta":""}"><strong>${atrasados}</strong><small>Com pendência ou atraso</small></div>
    <div class="kpi ${media>7?"alerta":""}"><strong>${media===null?"—":media.toFixed(1).replace(".",",")+" d"}</strong><small>Média aprovação → início (90 dias). Meta: 7</small></div>`;

  let lista = DADOS.filter(v=>
    (mostrarEnc || !v.encerrada) &&
    (!loja || v.loja===loja) &&
    (filtroEtapa===null || v.idx===filtroEtapa) &&
    (!soAtraso || v.atraso) &&
    (!busca || [v.codigo,v.cargo,v.candidato,v.loja].join(" ").toLowerCase().includes(busca))
  ).sort((a,b)=> (a.encerrada-b.encerrada) || (b.atraso-a.atraso) || (b.idx-a.idx));

  const el = document.getElementById("lista");
  if(!lista.length){ el.innerHTML = `<div class="vazio">Nenhuma vaga com esses filtros. Use "Limpar filtros" para ver todas.</div>`; return; }

  el.innerHTML = lista.map(v=>{
    const trilha = ETAPAS.map((e,i)=>{
      const cls = i<v.idx ? "ok" : (i===v.idx ? (v.idx===6?"ok":"atual "+(v.atraso?"atraso":"")) : "");
      return (i?`<i class="${i<=v.idx?"ok":""}"></i>`:"") + `<span class="ponto ${cls}" title="${e.nome}"></span>`;
    }).join("");
    let txt = `<b>${ETAPAS[v.idx].nome}</b>`;
    if(v.encerrada) txt = `<b>${esc(v.situacao)}</b>`;
    else if(v.idx===0) txt += v.abertura ? ` · aberta em ${fmt(dt(v.abertura))}` : "";
    else if(v.idx===4){ const p=proximaJanela(HOJE); txt += p?` · sugestão: ${fmt(p)}`:""; }
    else if(v.idx===5) txt += ` · ${fmt(dt(v.admissao))}`;
    else if(v.idx===6) txt += ` · ${fmt(dt(v.inicio))}`;

    const tags = [];
    if(v.decorridos!==null && !v.encerrada) tags.push(`<span class="tag d">${v.idx===6?"Concluído em ":""}D+${v.decorridos}</span>`);
    v.alertas.forEach(a=>tags.push(`<span class="tag a">${esc(a)}</span>`));
    if(v.candidato) tags.push(`<span class="tag n">${esc(v.candidato)}</span>`);

    return `<article class="linha ${v.encerrada?"encerrada":""}">
      <div class="vaga"><span class="cod">${esc(v.codigo)}</span><strong>${esc(v.cargo)}</strong>
        <small>${esc(v.loja)}${v.turno?" · "+esc(v.turno):""}</small></div>
      <div><div class="trilha" aria-label="Etapa atual: ${ETAPAS[v.idx].nome}">${trilha}</div><div class="trilha-txt">${txt}</div></div>
      <div class="info">${tags.join("")}</div>
    </article>`;
  }).join("");
}

async function iniciar(){
  let json;
  try{
    const r = await fetch("vagas.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    json = await r.json();
  }catch(e){
    json = EXEMPLO;
    document.getElementById("aviso").style.display="block";
  }
  DADOS = (json.vagas||[]).map(analisar);
  const at = json.atualizado_em ? new Date(json.atualizado_em) : null;
  document.getElementById("atualizado").textContent = at
    ? `Atualizado em ${at.toLocaleDateString("pt-BR")} às ${at.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`
    : "Sem data de atualização";
  const p = proximaJanela(HOJE);
  document.getElementById("proxima").textContent = p ? fmt(p) : "—";

  const lojas = [...new Set(DADOS.map(v=>v.loja).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true}));
  document.getElementById("loja").innerHTML += lojas.map(l=>`<option>${esc(l)}</option>`).join("");

  ["busca","loja","soAtraso","encerrados"].forEach(id=>document.getElementById(id).addEventListener("input",render));
  document.getElementById("limpar").onclick=()=>{
    document.getElementById("busca").value=""; document.getElementById("loja").value="";
    document.getElementById("soAtraso").checked=false; document.getElementById("encerrados").checked=false;
    filtroEtapa=null; render();
  };
  render();
}
iniciar();
</script>
</body>
</html>
